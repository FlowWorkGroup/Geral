name: Infisical Universal Auth Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authenticate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install Infisical CLI
        shell: bash
        run: |
          curl -1sLf 'https://artifacts-cli.infisical.com/install.sh' | sudo bash
          infisical --version

      - name: Validate Universal Auth
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        shell: bash
        run: |
          set +x
          if [[ -z "$INFISICAL_CLIENT_ID" || -z "$INFISICAL_CLIENT_SECRET" ]]; then
            echo "::error::Missing GitHub Actions secrets INFISICAL_CLIENT_ID and/or INFISICAL_CLIENT_SECRET."
            exit 1
          fi
          infisical login --method=universal-auth \
            --client-id="$INFISICAL_CLIENT_ID" \
            --client-secret="$INFISICAL_CLIENT_SECRET"
          infisical login status
